name: Check causelist

on:
  schedule:
    # Runs at 05:00 and 09:30 UTC = 10:30am and 3:00pm IST. Adjust as you like.
    - cron: "0 5 * * 1-6"
    - cron: "30 9 * * 1-6"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        run: python causelist_watcher.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "causelist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cases_auto.json manifest.json causelist_dashboard.html watcher.log
          git diff --cached --quiet || git commit -m "Auto-update causelist data"
          git push
